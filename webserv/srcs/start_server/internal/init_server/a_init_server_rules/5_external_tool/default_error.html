<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{statusCode}} {{reasonPhrase}}</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0b4dbb;
  color: #ffffff;
  font-family: Arial, sans-serif;
  position: relative;
}

.content {
  text-align: center;
  padding: 24px;
}

h1 {
  margin: 0;
  font-size: 96px;
  font-weight: 700;
}

p {
  margin: 12px 0 0;
  font-size: 24px;
}

.note {
  position: absolute;
  right: 16px;
  bottom: 16px;
  font-size: 12px;
  opacity: 0.8;
}

a {
  display: inline-block;
  margin-top: 28px;
  padding: 12px 20px;
  border-radius: 6px;
  background: #ffffff;
  color: #0b4dbb;
  text-decoration: none;
  font-weight: 700;
}
</style>
</head>
<body>
  <main class="content">
    <h1>{{statusCode}}</h1>
    <p>{{reasonPhrase}}</p>
    <a href="/">Back to Home</a>
  </main>
  <div class="note">(default error page)</div>
</body>
</html>
